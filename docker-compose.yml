name: media-stack

# Stack de medios auto-hospedado con acceso externo via subpaths (excepto
# apps de puerto dedicado: qBittorrent, Jackett, FlareSolverr, Jellyfin).
# Reverse proxy: Caddy con Caddyfile estático (./caddy/Caddyfile).
# Acceso: http://<IP-O-DOMINIO>/{sonarr,radarr,bazarr,jellyseerr,wizarr}
#         http://<IP-O-DOMINIO>:8096 (jellyfin), :8080 (qbittorrent),
#         :9117 (jackett), :8191 (flaresolverr)
#
# Cada app necesita tener su "Base URL" / "UrlBase" seteada para que el subpath funcione.
# Después del primer boot corré `scripts/configure-base-urls.sh` para configurarlas
# y reiniciar las apps.
#
# ─── Paths ────────────────────────────────────────────────────────────────────
# Las rutas de host (./config, ./data) se configuran vía variables de entorno
# en un archivo `.env` al lado de este compose. Copiá `.env.example` como `.env`
# y editá los valores si querés mover las carpetas (ej. a /srv/media-stack).
# Defaults apuntan a ./config y ./data relativos al compose, igual que antes.
#
# ─── Data layout (TRaSH Guides) ────────────────────────────────────────────────
# La estructura interna sigue la convención de TRaSH Guides para que los *arr
# puedan usar hardlinks y moves atómicos entre /data/torrents y /data/media.
# Ver docs/DATA_LAYOUT.md o https://trash-guides.info/File-and-Folder-Structure/How-to-set-up/Docker/

services:
  # === Reverse proxy (Caddy con Caddyfile estático) ===
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile vive en el repo (./caddy/) — no se ignora por .gitignore,
      # así un clon fresco tiene el archivo disponible para el bind mount.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  # === Indexer manager ===
  # Jackett se expone DIRECTO en :9117 del host. Lo usan Sonarr/Radarr
  # via http://jackett:9117 adentro de la red Docker (no requiere subpath).
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    ports:
      - "9117:9117"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - AUTO_UPDATE=true
    volumes:
      - ${CONFIG_DIR:-./config}/jackett:/config
      - ${DATA_DIR:-./data}/downloads:/downloads
    networks:
      - proxy

  # === FlareSolverr (resuelve challenges de Cloudflare para indexers) ===
  # Se expone directo en :8191 del host, sin pasar por Caddy.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    networks:
      - proxy

  # === TV shows ===
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      # TRaSH layout: Sonarr ve /data entero para que los hardlinks funcionen
      # y los moves desde /data/torrents a /data/media sean atómicos.
      - ${DATA_DIR:-./data}:/data
    networks:
      - proxy

  # === Movies ===
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${DATA_DIR:-./data}:/data
    networks:
      - proxy

  # === Subtitles ===
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
    volumes:
      - ${CONFIG_DIR:-./config}/bazarr:/config
      # Bazarr solo necesita ver la biblioteca final.
      - ${DATA_DIR:-./data}/media:/data/media
    depends_on:
      - radarr
      - sonarr
    networks:
      - proxy

  # === VPN (Gluetun — ProtonVPN Wireguard) ===
  # qBittorrent enruta todo su tráfico de red a través de este container
  # (ver network_mode: "service:gluetun" en su definición). El puerto 8080
  # del WebUI de qBittorrent se publica acá porque gluetun es quien tiene
  # la stack de red.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8090:8090"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WG_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
      - TZ=America/Argentina/Mendoza
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8090/api/v2/app/setPreferences 2>&1'
    volumes:
      - ${CONFIG_DIR:-./config}/gluetun:/gluetun
    networks:
      - proxy

  # === Downloads ===
  # qBittorrent no se expone directo: todo su tráfico (incluido el WebUI en
  # :8080) pasa por el namespace de red de gluetun (network_mode). No
  # soporta subpath de forma estable, por eso tampoco pasa por Caddy.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - WEBUI_PORT=8090
    volumes:
      - ${CONFIG_DIR:-./config}/qbittorrent:/config
      # qBittorrent solo escribe en /data/torrents. Los *arr mueven los archivos
      # terminados a /data/media vía hardlink + delete del original.
      - ${DATA_DIR:-./data}/torrents:/data/torrents

  # === Real-Debrid client (downloader adicional, sin VPN) ===
  # No hace P2P — solo HTTPS directo contra la API de Real-Debrid, por eso NO
  # comparte el namespace de red de gluetun. Usa la red `proxy` como
  # Sonarr/Radarr para que puedan alcanzarlo.
  rdtclient:
    image: rogerfar/rdtclient
    container_name: rdtclient
    restart: unless-stopped
    ports:
      - "6500:6500"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
    volumes:
      - ${CONFIG_DIR:-./config}/rdtclient:/data/db
      - ${DATA_DIR:-./data}/torrents:/data/torrents
    networks:
      - proxy

  # === Media server ===
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - JELLYFIN_PublishedServerUrl=http://192.168.68.57:8096
    volumes:
      - ${CONFIG_DIR:-./config}/jellyfin:/config
      # Jellyfin solo escanea la biblioteca final.
      - ${DATA_DIR:-./data}/media:/data/media
    networks:
      - proxy

  # === Request management ===
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      - TZ=America/Argentina/Mendoza
      - LOG_LEVEL=info
    volumes:
      - ${CONFIG_DIR:-./config}/jellyseerr:/app/config
    networks:
      - proxy

  # === User invitation system ===
  # Imagen custom de pablokbs con APPLICATION_ROOT funcionando
  # (commits sobre wizarr upstream en junio 2026).
  wizarr:
    image: docker.io/pablokbs/wizarr
    container_name: wizarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Mendoza
      - APPLICATION_ROOT=/wizarr
      - APP_URL=http://192.168.68.57
    volumes:
      - ${CONFIG_DIR:-./config}/wizarr:/config
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
